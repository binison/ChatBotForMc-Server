enabled: true
debug: false

api:
  # 可选值：openai-compatible / bailian / aliyun-bailian / dashscope / qwen
  provider: "bailian"
  # 阿里百炼 / DashScope 兼容模式 Chat Completions 地址
  base-url: "https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions"
  api-key: ""
  # 大多数兼容接口使用 Authorization + Bearer；如接别家可按需改 header/prefix
  auth-header: "Authorization"
  auth-prefix: "Bearer "
  model: "qwen-plus"
  timeout-ms: 20000
  # 设为 0 表示不主动限制上游输出 token
  max-tokens: 0
  temperature: 0.7

chat:
  reply-prefix: "&d[米糯]&r "
  max-input-length: 300
  # 设为 0 表示不在插件侧截断输出
  max-output-length: 0

context:
  enabled: true
  max-rounds: 6
  expire-minutes: 30
  system-prompt: "You are a helpful Minecraft server assistant. Keep replies concise and friendly."
  max-prompt-length: 2000

rate-limit:
  enabled: true
  cooldown-seconds: 5

messages:
  disabled: "&cChatbot is currently disabled."
  missing-api-key: "&cChatbot API key is not configured."
  no-permission: "&cYou do not have permission to use this command."
  too-long: "&cYour message is too long."
  cooldown: "&ePlease wait a moment before sending another request."
  empty: "&ePlease enter a message."
  busy: "&eYour previous AI request is still running."
  request-failed: "&cAI is currently unavailable. Please try again later."
  reset-done: "&aConversation context cleared."
  reload-done: "&aChatbot configuration reloaded."
  prompt-too-long: "&cThe prompt is too long."
  prompt-view: "&7Current system prompt: &f%s"
  prompt-set-done: "&aSystem prompt updated and saved."
  prompt-reset-done: "&aSystem prompt reset and saved."
